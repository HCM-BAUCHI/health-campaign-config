serviceMaps:
  serviceName: product
  mappings:
    - version: 1.0
      description: Persists Product
      fromTopic: namibia-save-product-topic
      isTransaction: true
      isAuditEnabled: true
      module: PRODUCT
      #below there fields are applied on each index if the object is an array
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      transactionCodeJsonPath: $.id
      #below twofields of audit are applied on the whole object recieved in the kafka
      
      auditAttributeBasePath: $.*      
      queryMaps:
        - query: INSERT INTO namibia.product(id, tenantId, type, name, manufacturer, additionalDetails, createdBy, lastModifiedBy, createdTime, lastModifiedTime, rowVersion, isDeleted) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.id
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.type
            - jsonPath: $.*.name
            - jsonPath: $.*.manufacturer
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.auditDetails.createdBy
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.createdTime
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted

    - version: 1.0
      description: Updates Product
      fromTopic: namibia-update-product-topic
      isTransaction: true
      isAuditEnabled: true
      module: PRODUCT-UPDATE
      #below there fields are applied on each index if the object is an array
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      transactionCodeJsonPath: $.id
      #below twofields of audit are applied on the whole object recieved in the kafka
      
      auditAttributeBasePath: $.*  
      queryMaps:
        - query: UPDATE namibia.product SET tenantId = ?, type = ?, name = ?, manufacturer = ?, additionalDetails = ?, lastModifiedBy = ?, lastModifiedTime = ?, rowVersion = ?, isDeleted = ? WHERE id = ?
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.type
            - jsonPath: $.*.name
            - jsonPath: $.*.manufacturer
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted
            - jsonPath: $.*.id

    - version: 1.0
      description: Saves a product variant
      fromTopic: namibia-save-product-variant-topic
      isTransaction: true
      isAuditEnabled: true
      module: PRODUCT-VARIANT
      #below there fields are applied on each index if the object is an array
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      transactionCodeJsonPath: $.id
      #below twofields of audit are applied on the whole object recieved in the kafka
      
      auditAttributeBasePath: $.*  
      queryMaps:
        - query: INSERT INTO namibia.product_variant(id, tenantId, productId, sku, variation, additionalDetails, createdBy, lastModifiedBy, createdTime, lastModifiedTime, rowVersion, isDeleted) VALUES (?,?,?,?,?,?,?,?,?,?,?,?);
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.id
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.productId
            - jsonPath: $.*.sku
            - jsonPath: $.*.variation
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.auditDetails.createdBy
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.createdTime
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted

    - version: 1.0
      description: Updates a product variant
      fromTopic: namibia-update-product-variant-topic
      isTransaction: true
      isAuditEnabled: true
      module: PRODUCT-UPDATE
      #below there fields are applied on each index if the object is an array
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      transactionCodeJsonPath: $.id
      #below twofields of audit are applied on the whole object recieved in the kafka
      
      auditAttributeBasePath: $.*  
      queryMaps:
        - query: UPDATE namibia.product_variant SET tenantId = ?, productId = ?, sku = ?, variation = ?, additionalDetails = ?, lastModifiedBy = ?, lastModifiedTime = ?, rowVersion = ?, isDeleted = ? WHERE id = ?;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.productId
            - jsonPath: $.*.sku
            - jsonPath: $.*.variation
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted
            - jsonPath: $.*.id