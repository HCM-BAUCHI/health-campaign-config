ServiceMaps:
  serviceName: transformer-error
  version: 1.0.0
  mappings:
    - topic: ko-transformer-error-topic
      configKey: INDEX
      indexes:
        - name: ko-transformer-error-index-v1
          type: errors
          id: $.id
          isBulk: false
          jsonPath: $
          timeStampField: $.timestamp
