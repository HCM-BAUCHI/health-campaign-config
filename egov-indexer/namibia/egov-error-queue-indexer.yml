ServiceMaps:
  serviceName: Tracer
  version: 1.0.0
  mappings:
    - topic: hcm22-error-details-indexer-topic
      configKey: INDEX
      indexes:
        - name: namibia-egov-tracer-error-details
          type: general
          id: $.uuid
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime
          customJsonMapping:
            indexMapping: { "Data": {} }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
    - topic: hcm22-egov-persister-deadletter
      configKey: INDEX
      indexes:
        - name: namibia-egov-tracer-error-details-persister
          type: general
          id: $.id
          isBulk: false
          timeStampField: $.ts
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
