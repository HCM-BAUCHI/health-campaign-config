ServiceMaps:
  serviceName: facility
  version: 1.0.0
  mappings:
  - topic: namibia-save-facility-topic
    configKey: INDEX
    indexes:
    - name: namibia-facility-index-v1
      type: facility
      id: $.clientReferenceId
      isBulk: true
      jsonPath: "$[?(@.usage nin ['OUTSIDE_HOUSEHOLD_PLACES','TRANSIT_POST'])]"
      timeStampField: $.auditDetails.createdTime
    - name: namibia-outside-household-index-v1
      type: outside-household
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.usage in ['OUTSIDE_HOUSEHOLD_PLACES','TRANSIT_POST'])]"
      timeStampField: $.auditDetails.createdTime
  - topic: namibia-update-facility-topic
    configKey: INDEX
    indexes:
    - name: namibia-facility-index-v1
      type: facility
      id: $.clientReferenceId
      isBulk: true
      jsonPath: "$[?(@.usage nin ['OUTSIDE_HOUSEHOLD_PLACES','TRANSIT_POST'])]"
      timeStampField: $.auditDetails.lastModifiedTime
    - name: namibia-outside-household-index-v1
      type: outside-household
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.usage in ['OUTSIDE_HOUSEHOLD_PLACES','TRANSIT_POST'])]"
      timeStampField: $.auditDetails.lastModifiedTime
