ServiceMaps:
  serviceName: Project Service
  version: 1.0.0
  mappings:
  - topic: namibia-transformer-producer-bulk-project-index-v1-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-index-v1
      type: projects
      id: $.id
      isBulk: true
      jsonPath: $
      customJsonMapping:
        indexMapping:
          Data: {}
        fieldMapping:
        - inJsonPath: $
          outJsonPath: $.Data
      timeStampField: $.lastModifiedTime
  - topic: namibia-save-project-beneficiary-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-beneficiary-index-v1
      type: project-beneficiary
      id: $.clientReferenceId,$.beneficiaryClientReferenceId,$.tenantId
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
  - topic: namibia-update-project-beneficiary-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-beneficiary-index-v1
      type: project-beneficiary
      id: $.clientReferenceId,$.beneficiaryClientReferenceId,$.tenantId
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: namibia-delete-project-beneficiary-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-beneficiary-index-v1
      type: project-beneficiary
      id: $.clientReferenceId,$.beneficiaryClientReferenceId,$.tenantId
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: namibia-save-project-resource-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-resource-index-v1
      type: project-resource
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
  - topic: namibia-update-project-resource-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-resource-index-v1
      type: project-resource
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: namibia-delete-project-resource-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-resource-index-v1
      type: project-resource
      id: $.id
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: namibia-save-project-facility-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-facility-index-v1
      type: project-facility
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.additionalFields.schema != 'OutsideHouseholdAssignment')]"
      timeStampField: $.auditDetails.createdTime
    - name: namibia-outside-household-campaign-index-v1
      type: outside-household-campaign
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.additionalFields.schema == 'OutsideHouseholdAssignment')]"
      timeStampField: $.auditDetails.createdTime
      customJsonMapping:
        indexMapping: { "Data": { } }
        fieldMapping:
        - inJsonPath: $.id
          outJsonPath: $.Data.id
        - inJsonPath: $.tenantId
          outJsonPath: $.Data.tenantId
        - inJsonPath: $.projectId
          outJsonPath: $.Data.projectId
        - inJsonPath: $.facilityId
          outJsonPath: $.Data.facilityId
        - inJsonPath: $.isDeleted
          outJsonPath: $.Data.isDeleted
        - inJsonPath: $.auditDetails
          outJsonPath: $.Data.auditDetails
  - topic: namibia-update-project-facility-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-facility-index-v1
      type: project-facility
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.additionalFields.schema != 'OutsideHouseholdAssignment')]"
      timeStampField: $.auditDetails.lastModifiedTime
    - name: namibia-outside-household-campaign-index-v1
      type: outside-household-campaign
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.additionalFields.schema == 'OutsideHouseholdAssignment')]"
      timeStampField: $.auditDetails.lastModifiedTime
      customJsonMapping:
        indexMapping: { "Data": { } }
        fieldMapping:
        - inJsonPath: $.id
          outJsonPath: $.Data.id
        - inJsonPath: $.tenantId
          outJsonPath: $.Data.tenantId
        - inJsonPath: $.projectId
          outJsonPath: $.Data.projectId
        - inJsonPath: $.facilityId
          outJsonPath: $.Data.facilityId
        - inJsonPath: $.isDeleted
          outJsonPath: $.Data.isDeleted
        - inJsonPath: $.auditDetails
          outJsonPath: $.Data.auditDetails
  - topic: namibia-delete-project-facility-topic
    configKey: INDEX
    indexes:
    - name: namibia-project-facility-index-v1
      type: project-facility
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.additionalFields.schema != 'OutsideHouseholdAssignment')]"
      timeStampField: $.auditDetails.lastModifiedTime
    - name: namibia-outside-household-campaign-index-v1
      type: outside-household-campaign
      id: $.id
      isBulk: true
      jsonPath: "$[?(@.additionalFields.schema == 'OutsideHouseholdAssignment')]"
      timeStampField: $.auditDetails.lastModifiedTime
      customJsonMapping:
        indexMapping: { "Data": { } }
        fieldMapping:
        - inJsonPath: $.id
          outJsonPath: $.Data.id
        - inJsonPath: $.tenantId
          outJsonPath: $.Data.tenantId
        - inJsonPath: $.projectId
          outJsonPath: $.Data.projectId
        - inJsonPath: $.facilityId
          outJsonPath: $.Data.facilityId
        - inJsonPath: $.isDeleted
          outJsonPath: $.Data.isDeleted
        - inJsonPath: $.auditDetails
          outJsonPath: $.Data.auditDetails
