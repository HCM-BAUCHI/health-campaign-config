ServiceMaps:
  serviceName: census-service
  version: 1.0.0
  mappings:
    - topic: so-census-create-topic
      configKey: INDEX
      indexes:
        - name: so-census-index-v1
          type: general
          id: $.id
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.Census
          customJsonMapping:
            indexMapping: {"Data":{}}
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
    - topic: so-census-update-topic
      configKey: INDEX
      indexes:
        - name: so-census-index-v1
          type: general
          id: $.id
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.Census
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
    - topic: so-census-bulk-update-topic
      configKey: INDEX
      indexes:
        - name: so-census-index-v1
          type: general
          id: $.id
          isBulk: true
          timeStampField: $.auditDetails.createdTime
          jsonPath: $.Census
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
