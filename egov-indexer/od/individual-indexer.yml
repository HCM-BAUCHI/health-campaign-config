ServiceMaps:
  serviceName: individual
  version: 1.0.0
  mappings:
  - topic: od-save-individual-topic
    configKey: INDEX
    indexes:
    - name: od-individual-index-v1
      type: individual
      id: $.clientReferenceId
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.createdTime
  - topic: od-update-individual-topic
    configKey: INDEX
    indexes:
    - name: od-individual-index-v1
      type: individual
      id: $.clientReferenceId
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
  - topic: od-delete-individual-topic
    configKey: INDEX
    indexes:
    - name: od-individual-index-v1
      type: individual
      id: $.clientReferenceId
      isBulk: true
      jsonPath: $.*
      timeStampField: $.auditDetails.lastModifiedTime
